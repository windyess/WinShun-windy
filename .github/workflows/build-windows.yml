name: Build WinShun for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          modules: qtsvg

      - name: Prepare Qt path
        shell: pwsh
        run: |
          "QT_DIR=$env:QT_ROOT_DIR" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Configure
        shell: pwsh
        run: cmake --preset release

      - name: Build
        shell: pwsh
        run: cmake --build --preset release --parallel

      - name: Deploy Qt runtime DLLs
        shell: pwsh
        run: |
          $exe = Get-ChildItem "build/release" -Filter "WinShun.exe" -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "未找到 WinShun.exe，构建输出目录可能已变化。"
          }

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --qmldir . `
            $exe.FullName

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: WinShun-windows-x64
          path: build/release/
          if-no-files-found: error
          retention-days: 14
