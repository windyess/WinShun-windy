name: Build WinShun Windows Packages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: winshun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          arch: win64_msvc2022_64
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Find Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $iscc) {
            throw "ISCC.exe was not found."
          }

          "ISCC=$iscc" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build packages
        shell: pwsh
        run: |
          ./scripts/release.ps1 `
            -SkipTests `
            -QtDir "$env:QT_ROOT_DIR" `
            -Iscc "$env:ISCC"

      - name: Verify output
        shell: pwsh
        run: |
          Get-ChildItem dist

          if (-not (Test-Path "dist\SHA256SUMS.txt")) {
            throw "SHA256SUMS.txt was not produced."
          }

          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: WinShun-Windows-x64
          path: |
            dist/WinShun-*-x64-setup.exe
            dist/WinShun-*-x64-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
