name: Build WinShun Windows Packages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: winshun-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 packages
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Enable MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          arch: win64_msvc2022_64
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Find Inno Setup
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object {
            Test-Path -LiteralPath $_
          } | Select-Object -First 1

          if (-not $iscc) {
            throw "Inno Setup compiler ISCC.exe was not found."
          }

          Write-Host "Inno Setup: $iscc"
          "ISCC=$iscc" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Find VC runtime
        shell: pwsh
        run: |
          if (-not $env:VCINSTALLDIR) {
            throw "VCINSTALLDIR is not set."
          }

          $redistRoot = Join-Path $env:VCINSTALLDIR "Redist\MSVC"

          if (-not (Test-Path -LiteralPath $redistRoot)) {
            throw "Visual C++ redistributable root was not found: $redistRoot"
          }

          $redistVersion = Get-ChildItem -LiteralPath $redistRoot -Directory |
            Where-Object {
              Test-Path -LiteralPath (
                Join-Path $_.FullName "x64\Microsoft.VC143.CRT\msvcp140.dll"
              )
            } |
            Sort-Object {
              try {
                [version]$_.Name
              } catch {
                [version]"0.0"
              }
            } -Descending |
            Select-Object -First 1

          if (-not $redistVersion) {
            throw "A usable Microsoft.VC143.CRT directory was not found."
          }

          $crt = Join-Path `
            $redistVersion.FullName `
            "x64\Microsoft.VC143.CRT"

          Write-Host "VC runtime: $crt"

          "VCToolsRedistDir=$($redistVersion.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify environment
        shell: pwsh
        run: |
          where.exe cl.exe
          where.exe cmake.exe
          where.exe ninja.exe

          cmake --version
          ninja --version

          Write-Host "Qt: $env:QT_ROOT_DIR"
          Write-Host "Inno Setup: $env:ISCC"
          Write-Host "VC runtime root: $env:VCToolsRedistDir"

          if (-not (Test-Path "$env:QT_ROOT_DIR\bin\qmake.exe")) {
            throw "Qt installation is incomplete."
          }

          if (-not (Test-Path "$env:ISCC")) {
            throw "ISCC.exe is unavailable."
          }

          $msvcp = Join-Path `
            $env:VCToolsRedistDir `
            "x64\Microsoft.VC143.CRT\msvcp140.dll"

          if (-not (Test-Path $msvcp)) {
            throw "msvcp140.dll is unavailable: $msvcp"
          }

      - name: Build installer and portable package
        shell: pwsh
        run: |
          ./scripts/release.ps1 `
            -SkipTests `
            -QtDir "$env:QT_ROOT_DIR" `
            -Iscc "$env:ISCC"

      - name: Verify packages
        shell: pwsh
        run: |
          $setup = Get-ChildItem `
            -LiteralPath "dist" `
            -Filter "WinShun-*-x64-setup.exe" |
            Select-Object -First 1

          $portable = Get-ChildItem `
            -LiteralPath "dist" `
            -Filter "WinShun-*-x64-portable.zip" |
            Select-Object -First 1

          if (-not $setup) {
            throw "Installer was not produced."
          }

          if (-not $portable) {
            throw "Portable package was not produced."
          }

          if (-not (Test-Path "dist\SHA256SUMS.txt")) {
            throw "SHA256SUMS.txt was not produced."
          }

          Write-Host "Installer: $($setup.Name)"
          Write-Host "Portable: $($portable.Name)"
          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: WinShun-Windows-x64
          path: |
            dist/WinShun-*-x64-setup.exe
            dist/WinShun-*-x64-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
